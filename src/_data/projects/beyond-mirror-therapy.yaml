  - text: Keeping in touch
    type: subheader
    width: full
  - text: |-
      There is also a less visible side to the environment: the app connects to a database to report information about its usage, and a live dashboard lets the therapist send commands back to the running app - including switching the balloon game's level, as shown in the video above. The exercise on the headset is one part of the project; being able to see what it is doing and interact with it from outside is another.

      Bringing together interaction research, programming and technical art has made this a particularly rewarding project to work on. From helping a small plant bloom to steering a balloon around a monument, the common thread is making a little movement go further - and giving it something worth doing.
    type: text
    width: 3/4

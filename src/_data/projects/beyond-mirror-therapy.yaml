  - text: Water you waiting for?
    type: header
    width: full
  - text: |-
      Of course, opening and closing your hand while staring at a counter isn't exactly the most exciting game idea. Instead, I made a little plant-watering environment: someone asks you to help their plant, you water it, and it grows and blossoms in front of you. The exercise becomes a small, visible achievement rather than just another repetition.

      There are two watering tools, each encouraging a different movement. The garden hose needs you to close and hold your hand, while the spray bottle responds to repeated squeezes. Early testing taught me that the model itself matters quite a bit: a spray-bottle-shaped tool made people squeeze repeatedly even when the instructions asked them to hold. Giving each mode its own recognizable tool helped the interaction make sense at a glance.

      The tool stays attached to the hand and the water is guided towards the plant, keeping the task focused on hand closure rather than fiddly picking-up or aiming. A little artistic assistance to go with the movement assistance.
    type: text
    width: 2/5

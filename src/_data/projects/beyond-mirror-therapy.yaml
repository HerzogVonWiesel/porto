  - text: Up, up and away
    type: header
    width: full
  - text: |-
      The project has since grown beyond the thesis: I adapted the exercise environment for AutoAssist, a collaborative stroke-rehabilitation research project funded by the German Federal Ministry of Education and Research (BMBF). With partners including ottobock and Friedrich-Alexander-Universität Erlangen-Nürnberg (FAU), my work on the VR environment is in preparation for an upcoming study at Uniklinik Erlangen with the exoskeleton setup.

      The broader project explores <i>assist-as-needed</i> rehabilitation: combining ultrasound sensing, intent detection, AI and VR to adapt assistance and exercise difficulty as a patient progresses. The goal is more personalized therapy that keeps people engaged in their practice. It's an exciting context for the same question that started my thesis: how can we make the movement someone has available enough to do something meaningful?
    type: text
    width: 3/4

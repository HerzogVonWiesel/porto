    media:
      - text: A different kind of brushwork
        type: header
        width: full
      - text: |-
          For the visuals, I wanted something friendly and lightly painterly. The main trick is a custom shader using a hand-painted texture filled with brushstrokes, with different strokes in each of its red, green and blue channels.

          Those three channels can also describe the X, Y and Z components of a surface normal - the direction a surface faces for lighting. Blending these painted directions with the model's actual normals makes the lighting break up into brush-like patches. The geometry stays the same, but the light behaves as if someone had painted over it. Some sweet little shader math, without having to put actual brushstrokes into every model!
        type: text
        width: full

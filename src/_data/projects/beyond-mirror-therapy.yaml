      - text: A little help behind the scenes
        type: subheader
        width: full
      - text: |-
          For this version, I added a balloon game. Opening and closing your hand moves a balloon up and down, collecting stars while avoiding obstacles. In the middle sits a beautiful monument that changes between levels, with the stars and obstacles floating around it. The therapist can switch between these levels from the live dashboard, changing the scene while the app is running.

          Different levels also meant different assets, and the project's timeline and budget didn't leave room to create everything by hand. For this part, I adopted an AI-based asset creation workflow to help build out the balloon game's environments. It was another opportunity to adapt my way of working to the project at hand, bringing asset creation and game development together on a tighter schedule.
        type: text
        width: full

  - text: Putting it to the test
    type: header
    width: full
  - text: |-
      To test the interaction, I ran an exploratory study with 11 healthy participants whose finger movement was restricted using medical tape. Each person tried the same two 60-second watering tasks with and without amplification, then rated how the interaction felt.

      What interested me most was how that assistance <i>felt</i>. With amplification, participants rated their grip as more powerful, closing their hand as more comfortable, and their own performance as more competent. They felt less insecure, discouraged or irritated, and were more willing to keep practicing. For an exercise built around repetition, feeling that your effort actually gets you somewhere is quite an important part of the experience.

      The questionnaire reflected this across several dimensions: perceived grip power rose from 3.36 to 6.73 on a seven-point scale, while competence rose from 3.41 to 6.07. Motivation and perceived rehabilitation value increased too, and burden/frustration dropped for every participant. The extra flowers were encouraging - everyone completed more plants, with the mean total rising from 3.45 to 8.36 - but the change from "this feels impossible" to "I can do this" was just as meaningful.

      Without amplification, some participants couldn't get a watering tool to work at all. With amplification, all 11 were able to use both tools and successfully water plants in both exercise modes. For those participants, assistance didn't simply improve a score; it made the exercise possible in the first place.

      There was a tradeoff: ratings related to agency and hand fidelity stayed high overall, but dipped slightly, particularly for how correctly the virtual fingers matched the physical hand. Some participants noticed glitchy or overactive movement. Making the action useful and keeping it believable need to go hand in hand, quite literally.

      This was a proof of concept under simulated restriction, rather than a test of recovery in stroke patients. What it showed was an encouraging interaction principle: limited movement could become enough to succeed at a task, while that success still depended on the person's own attempt.

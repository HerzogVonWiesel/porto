    media:
      - text: A little goes a long way
        type: header
        width: full
      - text: |-
          Hand rehabilitation after a stroke needs repeated, meaningful practice. But if your fingers can only move a little, a task that asks you to fully close your hand can become frustrating before you've really had a chance to start. And asking you to grip a VR controller to exercise that same grip? A little counterproductive.

          VR gives us an interesting opportunity here: the hand you see doesn't have to move exactly as far as the hand you have. Inspired by the idea of altered visual feedback used in mirror therapy, I wanted to explore whether amplifying the movement that is still there could make a task achievable, while keeping the user in control. Off to Unity I went!

          The demo starts with opening and closing the hand to calibrate its available range, then compares watering without and with amplification. The unassisted attempt doesn't succeed; with amplification, the user can complete the exercise.
        type: text
        width: full
  - text:  
    type: spacer
    width: full
  - text: Same hand, a little more reach
    type: header
    width: full
  - text: |-
      The prototype runs entirely on a Meta Quest 3, using its cameras to track the hands without controllers or extra wearable sensors. A short calibration records how far the user can open and close their hand, and I use that range to calculate how much to amplify the finger curl. A small physical closing movement can then become a fuller virtual grasp.

      The tricky part is <i>where</i> to do this. Simply posing the visible fingers differently wouldn't change what the game thinks your hand is doing. I placed a custom amplification component in Meta's hand-data pipeline, before both the hand visuals and interaction logic receive it. That way, the hand you see and the hand that operates the tool agree. Your movement still drives the action; it just gets a little more mileage.
    type: text
    width: 1/3

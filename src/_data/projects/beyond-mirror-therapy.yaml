  - text: |-
      I modeled and rigged three plant variants in Cinema 4D, then let the watering progress drive their growth animation in Unity. The colors in the joint-weighting view show which parts of the mesh are influenced by different joints. Scaling those joints one after another makes the plant unfold from a tiny seedling into its finished shape, with a blossom animation rounding off the task. Together with water particles, sound effects and small requests from different characters, it gives those repeated movements a little personality.

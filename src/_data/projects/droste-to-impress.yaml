      - text: A little tailoring
        type: header
        width: full
      - text: |-
          I generated several body styles as well, although those didn't look quite how I wanted at first. Generating an asset quickly is handy; being able to adjust the result is just as important. In this case, the adjustment meant removing some vertices from the models.

          Snapchat uses a custom 3D model format for these assets, so I quickly wrote a Python script to make those edits. A small bit of code to clean up the generated bodies and get them into a more useful shape for the filter. Apparently, even an AI-assisted wardrobe can need a little tailoring.
        type: text
        width: full
      - text: Come a little closer
        type: subheader
        width: full
      - text: |-
          A beautiful filter only gets you so far if people don't know they're supposed to interact with it. I added a distance estimator and a call to action that invites visitors to approach the mirror: <i>Come closer to become part of the Ancestry Gallery.</i>

          It's a small but important part of making the experience work in an exhibition. From farther away, the mirror gives you a reason to come over; up close, the portrait gives you something to play with. I randomize between styles, bodies and accessories, so the transformation has a little surprise built into it rather than giving everyone the same outfit.
        type: text
        width: full

    media:
      - text: Mirror, mirror, on the wall
        type: header
        width: full
      - text: |-
          Looking at an ancestry gallery usually means looking at other people. For this exhibition, the idea was to turn that around: let visitors see themselves as a painted portrait from the era of Annette von Droste-Hülshoff, becoming part of the gallery rather than just standing in front of it. A little trip into the Biedermeier period, with considerably less waiting around for the paint to dry.

          The interaction should feel like a magic mirror. You stand in front of it, recognize yourself, and discover what you might look like with a different outfit, a few accessories and a painterly finish. Keeping that recognizable connection to the person in front of the camera was just as important as the transformation itself.
        type: text
        width: full
      - text: A Snap decision
        type: subheader
        width: full
      - text: |-
          Rather than building the whole face-filter system from scratch, I decided to use Snapchat's technology. They've spent the past decade and a half getting rather good at making things follow people's faces, so borrowing that foundation felt like a sensible decision. More time for the portrait, less time reinventing face tracking.

          I developed the filter in Lens Studio and built a custom iPad app in Swift to host it. That brings the familiar technology into an exhibition setting: the visitor interacts with the mirror, while the app and filter take care of what's happening behind it.
        type: text
        width: full
  - text:  
    type: spacer
    width: full
  - multi: true
    width: 2/5
    media:
      - text: A well-dressed point cloud
        type: header
        width: full
      - text: |-
          The budget and schedule didn't leave room to model an entire historical wardrobe by hand. Instead, I put together an AI-assisted asset workflow using Lens Studio's generators. I found accessories I wanted to include in the portraits, then generated them as Gaussian splats: 3D representations made from lots of small, soft, overlapping splats rather than the usual polygon surfaces.

          The previews here show some of that dressing-up kit on a neutral head: hairstyles, hats, collars and jewelry. Seeing each piece in isolation made it easier to judge what it brought to the portrait before combining it with the rest. There is quite a difference between a subtle necklace and a hat that decides to become the main character.

          These accessories become part of the filter's mix-and-match wardrobe, giving the same visitor room to look rather different from one combination to the next.
        type: text
        width: full

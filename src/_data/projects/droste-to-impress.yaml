  - text: A family resemblance
    type: header
    width: full
  - text: |-
      This was a fun project to bring together: using an established face-filter system, creating an AI-assisted art workflow, writing a little model-processing code and giving it all a home in a custom app. The constraints shaped how I worked, but the goal stayed fairly simple: make visitors curious enough to step closer, and give them a portrait worth spending a moment with.

      A little technical art, a little interaction design and quite a few hats. All to help someone find their place in the ancestry gallery - at least until the next outfit comes along.
    type: text
    width: 3/4

hidden: false
name: Droste to Impress
subtitle: A magic mirror to the past
year: '2025'
description: |-
  A place in the ancestry gallery, without having to sit still for a painter? For an exhibition about Annette von Droste-Hülshoff, I created a magic mirror that turns visitors into Biedermeier-inspired painted portraits. A custom Snapchat filter runs inside an iPad app I built in Swift, combining painterly style transfer with generated bodies and Gaussian-splat accessories. With budget and timeline constraints shaping the workflow, I brought together Lens Studio's generative tools, a little Python-based model cleanup and a distance-aware invitation to come closer. The result is a playful way to become part of the gallery, complete with a randomized wardrobe. Droste to impress, quite literally.
tools: 'Lens Studio, Swift, Python, Various AI models'

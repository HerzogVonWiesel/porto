  - text: |-
      Accessories alone would make this more of a digital dressing room than a painted portrait. To bring everything into the same visual world, I also created a painterly style transfer with Lens Studio's generative tools. It gives the camera image that painted appearance, tying the person and the transformed scene together instead of leaving a very photographic face surrounded by historical clothing.

      The comparisons below alternate between the original images and the filtered versions. What I like about them is how much the overall impression changes while the person remains recognizable. A different wardrobe and a different visual style, but still very much the face that came to the mirror.
    type: text
    width: 3/4

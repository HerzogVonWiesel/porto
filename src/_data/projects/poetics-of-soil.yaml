      - text: A little family of particles
        type: subheader
        width: full
      - text: |-
          The next version spawned particles inside the volume of a rigged body instead. The rig supplies the moving shape, while child particles create trails from the parent particles, giving the avatar those thread-like extensions. Less independent decision-making, more following the family.

          Of course, Unity's VFX Graph had a little surprise waiting for me: I couldn't pass the parents' rigged particle positions on to the child graphs in the way I needed. To get the trails to start where they should, I had to reverse-engineer how those parent positions were calculated and reconstruct them for the children. A fairly technical detour for something that, ideally, should just look organic.

          Along the way, I also found a VFX Graph bug involving custom attributes in subgraphs and successfully reported it to the Unity team. If you're curious about that particular adventure, <a href='https://issuetracker.unity.com/issues/23462/vfx-graph-cant-find-custom-attributes-when-they-are-in-a-subgraph' target='_blank' rel='noopener noreferrer'>here's the issue on Unity's tracker →</a>.
        type: text
        width: full
  - text:  
    type: spacer
    width: full
  - multi: true
    width: 2/5
    media:
      - text: Branching out
        type: header
        width: full
      - text: |-
          Having a fungal-looking body is one thing; letting it reach out into the world is another. For an early interaction prototype, I cast rays from the avatar's hand to find an interaction root, then passed that information through a compute shader to the particle system. A raycast is basically asking: if I draw a line from here in this direction, what does it hit?

          The hand's particle trails, along with their branching sub-trails, could then move towards that root. The idea was to evoke mycorrhizal networks reaching out and communicating, making the gesture feel like an extension of the avatar rather than a separate interface. Less clicking a button, more making a connection.
        type: text
        width: full

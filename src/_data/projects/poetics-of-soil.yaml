    media:
      - text: Let there be (baked) light
        type: header
        width: full
      - text: |-
          Lighting was another place where the hardware budget had a say. Instead of calculating all of that lighting in real time, baked lighting stores the result ahead of time, letting us bring the atmosphere into the scene without asking the headset to do all the original work every frame.

          I worked on a universal baked-lighting material that could be used for every 3D object in the project. A common material for the environment, with the particle systems adding their own movement and detail on top. The clip here is a little eye candy showing how the two can come together - because optimizing a scene should still leave room for it to look beautiful.
        type: text
        width: full

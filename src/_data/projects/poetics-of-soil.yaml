      - text: |-
          Since this was a collaborative experience, the avatar also needed to make sense alongside other visitors. This early scene explores how multiple particle bodies might look together among the roots. It takes the same visual idea out of an isolated avatar test and puts it into a shared space, where those branching bodies become part of the surroundings.

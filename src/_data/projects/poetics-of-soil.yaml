    media:
      - text: Beneath the surface
        type: header
        width: full
      - text: |-
          Fungi have a rather different idea of what a body can look like. Instead of a neat outline with two arms and two legs, mycelium grows as networks of fine, branching threads. Through mycorrhizal associations, those threads connect fungi with plant roots. Quite an interesting starting point for an avatar!

          My part of the project was about exploring these ideas early on: figuring out how a particle body could move, how it might reach out into its surroundings, and how to make the visuals work within the headset's fairly unforgiving limits. The teaser here comes from the early funding stage, setting the atmosphere the exhibition was aiming for.
        type: text
        width: full

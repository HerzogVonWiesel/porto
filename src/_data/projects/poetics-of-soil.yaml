hidden: false
name: Poetics of Soil
subtitle: Fungal worlds on a standalone VR budget
year: '2026'
description: |-
  What would it feel like to become part of the network beneath our feet? For Poetics of Soil, a collaborative immersive VR exhibition about fungi with Marshmallow Laser Feast, I worked on the pre-production and early alpha stages, exploring how visitors could inhabit and interact with this underground world. My main contributions were a fungal-inspired particle avatar, early interaction prototypes, a universal baked-lighting material and an interaction that lets you explore CT scans of plant elements by walking into them. All of that on a standalone Vive Focus 3, which wasn't exactly handing out spare rendering power.
tools: 'Unity, Houdini'
cover_img: /images/projects/poetics-of-soil/pos_cover.png

    media:
      - text: One step deeper
        type: header
        width: full
      - text: |-
          Another interaction lets visitors explore CT scans of plant elements by walking into them. Rather than letting the scan video simply play from beginning to end, I made the visitor's position control which part of it is shown. Walk further in and you move deeper through the scan slices; step back and the sequence reverses.

          Your movement becomes the scrubber, turning something you'd normally watch on a screen into something you can explore spatially. A fairly direct interaction, but a lovely fit for VR: to see what's inside, you quite literally go inside.
        type: text
        width: full
  - text:  
    type: spacer
    width: full
  - text: |-
      This project brought together a lot of what I enjoy about technical art: finding a visual idea, building an interaction around it, and then figuring out how to make it work on the hardware you actually have. Working with Marshmallow Laser Feast on these early stages meant moving between experiments, engine limitations and the occasional bug report, all in service of a world that feels a little less like an interface and a little more alive. Plenty of branching paths, quite literally.
    type: text
    width: 3/4

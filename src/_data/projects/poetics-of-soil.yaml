    media:
      - text: Every particle for itself
        type: header
        width: full
      - text: |-
          The first avatar tests used real-time signed distance fields, or SDFs. These describe how far a point is from a surface, giving each particle something it can use to find its way towards the body. As the person moved, the field followed them, and the particles followed the field. Each little speck was doing its own bit of thinking - well, shader math, but let me romanticize it a little.

          It was a nice way to approach a body made of particles, but there was a rather important catch: this had to run on a Vive Focus 3. A standalone headset has to handle the whole VR scene on its own, and the resource budget wasn't going to let every particle have quite that much independence. The real-time SDF approach was dropped, and I went looking for a less expensive way to keep the same idea alive.
        type: text
        width: full
